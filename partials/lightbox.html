<div id="lightbox" role="dialog" aria-modal="true" aria-label="Artwork viewer">
  <button id="lightbox-close" aria-label="Close">&times;</button>
  <div class="lightbox-stage">
    <button id="lightbox-prev" aria-label="Previous artwork">&#8249;</button>
    <img id="lightbox-img" src="" alt="">
    <button id="lightbox-next" aria-label="Next artwork">&#8250;</button>
  </div>
  <aside id="lightbox-panel">
    <p id="lightbox-title"></p>
    <div id="lightbox-palette" class="palette-strip" aria-hidden="true"></div>
    <div id="lightbox-thumbs" aria-label="More photos of this artwork"></div>
    <div id="lightbox-buy"></div>
    <p id="lightbox-desc"></p>
    <a id="lightbox-inquire" class="btn-line" href="#">Inquire About the Original &rarr;</a>
  </aside>
</div>
